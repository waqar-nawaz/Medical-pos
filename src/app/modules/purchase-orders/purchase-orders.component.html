<app-page-header title="Purchase Orders" subtitle="Create purchase orders and receive stock">
  <button class="btn" (click)="openModal()">
    ➕ Add Purchase Orders
  </button>
</app-page-header>

<div class="card surface panel">
  <div class="tableWrap" *ngIf="rows.length; else empty">
    <table class="data-table">
      <thead>
        <tr>
          <th>PO</th>
          <th>Supplier</th>
          <th>Status</th>
          <th>Date</th>
          <th class="align-right"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of rows">
          <td><b>{{ r.poNo }}</b></td>
          <td>{{ r.supplierName || '-' }}</td>
          <td>
            <span class="badge" [ngClass]="r.status === 'RECEIVED' ? 'badge-success' : 'badge-warning'">{{ r.status }}</span>
          </td>
          <td>{{ r.createdAt | date:'medium' }}</td>
          <td class="align-right">
            <button class="btn btn-outline btn-sm" *ngIf="r.status !== 'RECEIVED'" (click)="receive(r)">
              📦 Receive
            </button>
            <span class="muted" *ngIf="r.status === 'RECEIVED'">Done</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #empty>
    <app-empty-state icon="🛒" title="No purchase orders yet"
      description="Create a PO to receive stock updates."></app-empty-state>
  </ng-template>
</div>

<!-- Create Purchase Order Modal -->
<div class="modal-backdrop" *ngIf="modalOpen" (click.self)="closeModal()">
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" type="button" (click)="closeModal()" aria-label="Close">&times;</button>
    <h2>➕ Create purchase order</h2>

    <div class="field">
      <label>Supplier</label>
      <select [formControl]="form.controls.supplierId">
        <option [ngValue]="null" disabled>Select supplier</option>
        <option *ngFor="let s of suppliers" [ngValue]="s.id">{{ s.name }}</option>
      </select>
    </div>

    <div class="lines">
      <div class="line" *ngFor="let ln of lines; let i = index">
        <select [(ngModel)]="ln.productId" class="grow">
          <option [ngValue]="0" disabled>Select product</option>
          <option *ngFor="let p of products" [ngValue]="p.id">{{ p.name }}</option>
        </select>
        <input type="number" min="1" [(ngModel)]="ln.qty" placeholder="Qty" style="width:110px" />
        <input type="number" min="0" [(ngModel)]="ln.cost" placeholder="Cost" style="width:140px" />
        <button class="btn-icon danger" (click)="removeLine(i)" title="Remove line">🗑️</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" (click)="closeModal()">Cancel</button>
      <button class="btn btn-outline" (click)="addLine()">➕ Add line</button>
      <button class="btn" (click)="create()">💾 Create</button>
    </div>
  </div>
</div>
