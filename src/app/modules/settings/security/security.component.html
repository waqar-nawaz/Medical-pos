<app-page-header title="Security" subtitle="Update password and account settings">
  <button class="btn btn-outline" routerLink="/settings">← Back</button>
</app-page-header>

<div class="card surface panel" style="max-width: 640px;">
  <div class="card-head">
    <div class="card-title">🔑 Change password</div>
  </div>
  <form [formGroup]="form" class="form">
    <div class="field">
      <label>Old password</label>
      <input type="password" formControlName="oldPassword" autocomplete="current-password" />
    </div>

    <div class="field">
      <label>New password</label>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      <div class="field-note">Minimum 8 characters</div>
    </div>

    <div style="margin-top:18px;">
      <button class="btn" type="button" (click)="save()" [disabled]="form.invalid || loading">
        💾 Update
      </button>
    </div>
  </form>
</div>
