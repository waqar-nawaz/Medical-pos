<app-page-header title="Security" subtitle="Update password and account settings">
  <button class="btn btn-outline" routerLink="/settings">← Back</button>
</app-page-header>

<div class="card surface panel" style="max-width: 640px;">
  <div class="card-head">
    <div class="card-title">🔑 Change password</div>
  </div>
  <form [formGroup]="form" class="form">
    <div class="field">
      <label>Old password</label>
      <div class="password-field">
        <input [type]="showOld ? 'text' : 'password'" formControlName="oldPassword" autocomplete="current-password" [class.invalid]="submitted && form.controls.oldPassword.invalid" />
        <button type="button" class="eye-toggle" (click)="showOld = !showOld" [attr.aria-label]="showOld ? 'Hide password' : 'Show password'">
          <svg *ngIf="!showOld" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="showOld" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <div class="field-error" *ngIf="submitted && form.controls.oldPassword.invalid">Old password is required</div>
    </div>

    <div class="field">
      <label>New password</label>
      <div class="password-field">
        <input [type]="showNew ? 'text' : 'password'" formControlName="newPassword" autocomplete="new-password" [class.invalid]="submitted && form.controls.newPassword.invalid" />
        <button type="button" class="eye-toggle" (click)="showNew = !showNew" [attr.aria-label]="showNew ? 'Hide password' : 'Show password'">
          <svg *ngIf="!showNew" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg *ngIf="showNew" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <div class="field-error" *ngIf="submitted && form.controls.newPassword.invalid; else newPwNote">Minimum 8 characters</div>
      <ng-template #newPwNote><div class="field-note">Minimum 8 characters</div></ng-template>
    </div>

    <div style="margin-top:18px;">
      <button class="btn" type="button" (click)="save()" [disabled]="loading">
        💾 Update
      </button>
    </div>
  </form>
</div>
