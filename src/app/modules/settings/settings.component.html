<app-page-header title="Settings" subtitle="Store profile, receipt footer, GST and preferences">
  <button class="btn btn-outline" routerLink="/settings/security">🔒 Security</button>
</app-page-header>

<div class="card surface panel">
  <div class="card-head">
    <div class="card-title">⚙️ Store settings</div>
  </div>
  <form [formGroup]="form" class="form">
    <div class="grid2">
      <div class="field">
        <label>Store name *</label>
        <input formControlName="storeName" [class.invalid]="submitted && form.controls.storeName.invalid" />
        <div class="field-error" *ngIf="submitted && form.controls.storeName.invalid">Store name is required</div>
      </div>

      <div class="field">
        <label>Phone</label>
        <input formControlName="storePhone" />
      </div>
    </div>

    <div class="field">
      <label>Address</label>
      <textarea rows="2" formControlName="storeAddress"></textarea>
    </div>

    <div class="field">
      <label>Receipt footer</label>
      <textarea rows="2" formControlName="receiptFooter"></textarea>
    </div>

    <div class="field">
      <label>GST enabled</label>
      <select formControlName="gstEnabled">
        <option [ngValue]="true">Enabled</option>
        <option [ngValue]="false">Disabled</option>
      </select>
    </div>

    <div class="actions" style="margin-top:18px;">
      <button class="btn" type="button" (click)="save()" [disabled]="loading">
        💾 Save
      </button>
      <button class="btn btn-outline" type="button" (click)="downloadBackup()" [disabled]="loading">
        ⬇️ Download Backup
      </button>
    </div>
  </form>
</div>
