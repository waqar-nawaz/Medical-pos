<div class="login-wrap">
  <form class="login-card" (ngSubmit)="submit()" role="region" aria-label="Login form">
    <div class="logo">⚕️</div>
    <h1>Medical POS</h1>
    <p class="subtitle">Sign in to continue</p>

    <label>Email <span class="required-mark">*</span></label>
    <input type="email" formControlName="email" autocomplete="username" [class.invalid]="submitted && form.controls.email.invalid" />
    <div class="field-error" *ngIf="submitted && form.controls.email.invalid">Enter a valid email</div>

    <label>Password <span class="required-mark">*</span></label>
    <input type="password" formControlName="password" autocomplete="current-password" [class.invalid]="submitted && form.controls.password.invalid" />
    <div class="field-error" *ngIf="submitted && form.controls.password.invalid">Password is required</div>

    <button type="submit" [disabled]="loading">{{ loading ? 'Signing in…' : 'Sign in' }}</button>

    <div class="row">
      <a routerLink="/auth/register">Create account</a>
    </div>
  </form>
</div>
