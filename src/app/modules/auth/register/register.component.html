<div class="login-wrap">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" role="region" aria-label="Registration form">
    <div class="logo">⚕️</div>
    <h1>Create account</h1>
    <p class="subtitle">Cashier accounts can be created here</p>

    <label>Full name <span class="required-mark">*</span></label>
    <input type="text" formControlName="name" autocomplete="name" [class.invalid]="submitted && form.controls.name.invalid" />
    <div class="field-error" *ngIf="submitted && form.controls.name.invalid">Name is required</div>

    <label>Email <span class="required-mark">*</span></label>
    <input type="email" formControlName="email" autocomplete="email" [class.invalid]="submitted && form.controls.email.invalid" />
    <div class="field-error" *ngIf="submitted && form.controls.email.invalid">Enter a valid email</div>

    <label>Password <span class="required-mark">*</span></label>
    <div class="password-field">
      <input [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="new-password" [class.invalid]="submitted && form.controls.password.invalid" />
      <button type="button" class="eye-toggle" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
        <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <div class="field-error" *ngIf="submitted && form.controls.password.invalid">Minimum 8 characters</div>

    <button type="submit" [disabled]="loading">{{ loading ? 'Creating…' : 'Create' }}</button>

    <div class="row">
      <a routerLink="/auth/login">Back to login</a>
    </div>
  </form>
</div>
