<div class="login-wrap">
  <form class="login-card" (ngSubmit)="submit()" role="region" aria-label="Registration form">
    <div class="logo">⚕️</div>
    <h1>Create account</h1>
    <p class="subtitle">Cashier accounts can be created here</p>

    <label>Full name <span class="required-mark">*</span></label>
    <input type="text" formControlName="name" autocomplete="name" [class.invalid]="submitted && form.controls.name.invalid" />
    <div class="field-error" *ngIf="submitted && form.controls.name.invalid">Name is required</div>

    <label>Email <span class="required-mark">*</span></label>
    <input type="email" formControlName="email" autocomplete="email" [class.invalid]="submitted && form.controls.email.invalid" />
    <div class="field-error" *ngIf="submitted && form.controls.email.invalid">Enter a valid email</div>

    <label>Password <span class="required-mark">*</span></label>
    <input type="password" formControlName="password" autocomplete="new-password" [class.invalid]="submitted && form.controls.password.invalid" />
    <div class="field-error" *ngIf="submitted && form.controls.password.invalid">Minimum 8 characters</div>

    <button type="submit" [disabled]="loading">{{ loading ? 'Creating…' : 'Create' }}</button>

    <div class="row">
      <a routerLink="/auth/login">Back to login</a>
    </div>
  </form>
</div>
