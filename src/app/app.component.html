<a class="skip-link" href="#main">Skip to content</a>

<ng-container *ngIf="auth.isLoggedIn$ | async; else authView">
<div class="shell">
  <header class="mobile-topbar">
    <button class="hamburger" (click)="toggleMenu()" aria-label="Menu">☰</button>
    <span class="brand">⚕️ Medical POS</span>
  </header>

  <div class="overlay" *ngIf="menuOpen" (click)="toggleMenu()"></div>

  <aside class="sidebar" [class.open]="menuOpen" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-top desktop-only">
      <div class="brand" *ngIf="!sidebarCollapsed">⚕️&nbsp; Medical POS</div>
      <button class="collapse-btn" (click)="toggleSidebar()" [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
        <svg *ngIf="!sidebarCollapsed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <svg *ngIf="sidebarCollapsed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <nav aria-label="Primary navigation">
      <a routerLink="/dashboard" routerLinkActive="active" data-label="Dashboard" *ngIf="canAccess('dashboard')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span *ngIf="!sidebarCollapsed">Dashboard</span>
      </a>
      <a routerLink="/pos" routerLinkActive="active" data-label="New Bill / POS" *ngIf="canAccess('pos')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span *ngIf="!sidebarCollapsed">New Bill / POS</span>
      </a>
      <a routerLink="/products" routerLinkActive="active" data-label="Inventory" *ngIf="canAccess('products')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        <span *ngIf="!sidebarCollapsed">Inventory</span>
      </a>
      <a routerLink="/sales" routerLinkActive="active" data-label="Sales History" *ngIf="canAccess('sales')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span *ngIf="!sidebarCollapsed">Sales History</span>
      </a>
      <a routerLink="/suppliers" routerLinkActive="active" data-label="Suppliers" *ngIf="canAccess('suppliers')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span *ngIf="!sidebarCollapsed">Suppliers</span>
      </a>
      <a routerLink="/customers" routerLinkActive="active" data-label="Customers" *ngIf="canAccess('customers')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span *ngIf="!sidebarCollapsed">Customers</span>
      </a>
      <a routerLink="/purchase-orders" routerLinkActive="active" data-label="Purchase Orders" *ngIf="canAccess('purchase-orders')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span *ngIf="!sidebarCollapsed">Purchase Orders</span>
      </a>
      <a routerLink="/reports" routerLinkActive="active" data-label="Reports" *ngIf="canAccess('reports')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span *ngIf="!sidebarCollapsed">Reports</span>
      </a>
    </nav>

    <nav class="settings-nav">
      <a routerLink="/settings" routerLinkActive="active" data-label="Settings" *ngIf="canAccess('settings')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span *ngIf="!sidebarCollapsed">Settings</span>
      </a>
      <a routerLink="/users" routerLinkActive="active" data-label="User Management" *ngIf="canAccess('users')">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><path d="M2 20v-1a5 5 0 0 1 5-5v0a5 5 0 0 1 5 5v1"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M22 20v-1a5 5 0 0 0-4-4.87"/></svg>
        <span *ngIf="!sidebarCollapsed">User Management</span>
      </a>
    </nav>

    <button class="theme-toggle" (click)="toggleTheme()" data-label="Toggle theme">
      <svg *ngIf="theme.current === 'light'" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg *ngIf="theme.current === 'dark'" class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span *ngIf="!sidebarCollapsed">{{ theme.current === 'light' ? 'Dark mode' : 'Light mode' }}</span>
    </button>

    <div class="user-box" *ngIf="auth.user$ | async as u">
      <ng-container *ngIf="!sidebarCollapsed">
        <div class="name">{{ u.name || 'User' }}</div>
        <div class="role">{{ u.role || 'user' }} · v{{ auth.version }}</div>
      </ng-container>
      <div class="avatar" *ngIf="sidebarCollapsed">{{ (u.name || 'U').charAt(0) }}</div>
      <button class="logout-btn" (click)="logout()" data-label="Log out">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span *ngIf="!sidebarCollapsed">Log out</span>
      </button>
    </div>
  </aside>

  <main id="main" class="content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>

</ng-container>

<ng-template #authView>
  <main id="main" class="auth-view" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</ng-template>

<app-confirm-modal></app-confirm-modal>
